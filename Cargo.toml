[package]
name = "engine"
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
description = "A small 2D game engine: software and wgpu renderers, ECS, physics, audio"
license = "Apache-2.0"

[features]
default = ["gpu", "audio"]
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]
audio = ["dep:rodio"]

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"], optional = true }
font8x8 = { version = "0.3.1", default-features = false, features = ["unicode"] }
hecs = "0.11.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
minifb = { version = "0.29.0", default-features = false, features = ["x11"] }
pollster = { version = "1.0.1", optional = true }
rodio = { version = "0.23.0", default-features = false, features = ["playback", "wav", "vorbis"], optional = true }
wgpu = { version = "30.0.1", default-features = false, features = ["vulkan", "gles", "metal", "dx12", "wgsl"], optional = true }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11-dl = "2.21.0"

[lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.dev]
debug = "line-tables-only"
