[package]
name = "engine"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
font8x8 = { version = "0.3.1", default-features = false, features = ["unicode"] }
hecs = "0.11.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
minifb = { version = "0.29.0", default-features = false, features = ["x11"] }
pollster = "1.0.1"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "wav"] }
wgpu = { version = "30.0.1", default-features = false, features = ["vulkan", "gles", "wgsl"] }
